[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-onboarding-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "PyJWT[crypto]>=2.9,<3", "python-multipart>=0.0.18", "azure-identity>=1.19", "azure-ai-projects>=2.3,<3", "openai>=1.100", "alembic>=1.14", "openpyxl>=3.1", "azure-ai-documentintelligence>=1.0", "azure-storage-blob>=12.24", "httpx>=0.27", "python-dotenv[cli]>=1.0"]

[project.optional-dependencies]
observability = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp>=1.30,<2"]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
